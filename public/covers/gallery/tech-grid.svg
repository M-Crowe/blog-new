<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Tech Grid Cover</title>
  <desc id="desc">Gradient background with geometric grid and glowing panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g stroke="rgba(255,255,255,0.14)" stroke-width="1">
    <path d="M0 120h1600M0 240h1600M0 360h1600M0 480h1600M0 600h1600M0 720h1600"/>
    <path d="M180 0v900M360 0v900M540 0v900M720 0v900M900 0v900M1080 0v900M1260 0v900M1440 0v900"/>
  </g>
  <rect x="180" y="170" width="1240" height="560" rx="24" fill="rgba(15,23,42,0.35)" stroke="url(#glow)" stroke-width="2"/>
  <circle cx="300" cy="280" r="48" fill="#22d3ee" fill-opacity="0.35"/>
  <circle cx="1260" cy="620" r="86" fill="#93c5fd" fill-opacity="0.25"/>
</svg>
